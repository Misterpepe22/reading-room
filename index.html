<!DOCTYPE html>
<html class="staticrypt-html" lang="en" data-rr-gate="2">
<head>
<meta charset="utf-8" />
<title>Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<style id="gate-style">
:focus-visible{outline:3px solid #2563eb !important;outline-offset:3px}
.staticrypt-toggle-password-visibility{border:0;background:transparent;box-sizing:content-box}
.staticrypt-toggle-password-visibility img{width:20px;height:20px;display:block}
.staticrypt-status{color:#b91c1c;font-size:14px}

            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: min(360px, calc(100% - 24px));
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: min(360px, calc(100% - 24px));
                margin: 0 auto 100px;
                padding: clamp(20px, 7vw, 45px);
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #171717;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #171717;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f5f5f5;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
</head>

const te=new TextEncoder(), td=new TextDecoder();
const saved={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},remove:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>{if(!/^[0-9a-f]{64}$/i.test(h))throw new Error('bad key');const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};

async function hashPw(p){let h=await pb(p,1000,'SHA-1');h=await pb(h,14000,'SHA-256');return pb(h,585000,'SHA-256')}
async function keyFrom(hp){const ikm=await sub.importKey('raw',unhex(hp),'HKDF',false,['deriveKey']);return sub.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('reading-room/v2'),info:te.encode('content')},ikm,{name:'AES-GCM',length:256},false,['decrypt'])}
async function bytes(p,fresh){const r=await fetch(p,{cache:fresh?'no-cache':'default'});if(!r.ok)throw new Error('HTTP '+r.status);return new Uint8Array(await r.arrayBuffer())}
async function open(key,p,fresh){const b=await bytes(p,fresh);if(b.length<32||b[0]!==82||b[1]!==82||b[2]!==50)throw new Error('not a library file');const pt=await sub.decrypt({name:'AES-GCM',iv:b.subarray(4,16),additionalData:b.subarray(0,4)},key,b.subarray(16));return {t:b[3],pt:new Uint8Array(pt)}}
async function gunzip(u){const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function json(key,p,fresh){const o=await open(key,p,fresh);return JSON.parse(td.decode(o.t===71?await gunzip(o.pt):o.pt))}

function clearSaved(){saved.remove(KP);saved.remove(KE)}

async function unlock(hp,remember){
  const key=await keyFrom(hp);
  let manifest;
  try{manifest=await json(key,'d/m.enc',true)}
  catch(e){if(e&&e.name==='OperationError')return 'bad';throw e}
  const app=await json(key,manifest.app,false);

/* ---- Remove marks and fix suggestions ----
   Marks and suggestions are kept on this device (localStorage rr_marks_v1) until you tap Send.
   Send opens a pre-filled GitHub issue on Misterpepe22/reading-room holding ONE locked blob
   (ECDH P-256 + AES-GCM to Sesame's inbox key). Only issues filed by Misterpepe22 are accepted by the
   nightly cleanup. The blob also carries the patch key (HKDF of the library key, info "patch"), which
   lets the cleanup lock fixes in d/p.enc without ever knowing the library password.
   Public files read here: d/removed.json (opaque ids of removed posts) and d/p.enc (locked fixes, plus "done"
   receipts: suggestions and search requests Sesame finished and verified live, matched by post id + send time).
   A sent item leaves this list only when it is removed, fixed through d/p.enc, or has a done receipt. */
const INBOX_PUB='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEb8S7w8DLbVnfF4V8MxGND94SDXBEwd5xcxycn6/149UApjOqWP5e4Q8GRwIa5QOvsUQ2iZVH8A6mgfE+gpb0Dw==', ISSUE_URL='https://github.com/Misterpepe22/reading-room/issues/new', MK='rr_marks_v1', MAXB=6200;

const RQUICK=['More from an account','A web page','A topic or style','A post link','Bookmarks folder','Other'];

async function gzipU(u){const s=new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
const normLink=l=>String(l||'').split('?')[0].replace(/\/+$/,'');
async function marksInit(hp){
  const ikm=await sub.importKey('raw',unhex(hp),'HKDF',false,['deriveKey','deriveBits']);
  const H=info=>({name:'HKDF',hash:'SHA-256',salt:te.encode('reading-room/v2'),info:te.encode(info)});

  try{const r=await fetch('d/removed.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();(d.removed||[]).forEach(x=>{if(x&&/^[0-9a-f]{16}$/.test(x.id))removed.add(x.id)})}}catch(e){}
  try{const r=await fetch('d/p.enc?t='+Date.now(),{cache:'no-store'});if(r.ok){const b=new Uint8Array(await r.arrayBuffer());if(b.length>32&&b[0]===82&&b[1]===82&&b[2]===50){const pt=new Uint8Array(await sub.decrypt({name:'AES-GCM',iv:b.subarray(4,16),additionalData:b.subarray(0,4)},patchKey,b.subarray(16)));const pj=JSON.parse(td.decode(b[3]===71?await gunzip(pt):pt))||{};patches=pj.posts||{};const dn=pj.done||{};(Array.isArray(dn.sg)?dn.sg:[]).forEach(x=>{if(x&&/^[0-9a-f]{16}$/.test(x.id)&&Number.isSafeInteger(x.at))doneSg.add(x.id+':'+x.at)});(Array.isArray(dn.rq)?dn.rq:[]).forEach(x=>{if(x&&Number.isSafeInteger(x.at))doneRq.add(String(x.at))})}}}catch(e){}

    if(typeof p.title==='string'&&p.title.trim())r.title=p.title;
    if(Array.isArray(p.hide_images)){const h=new Set(p.hide_images);r.images=r.images.filter((m,k)=>!h.has(k))}
    (p.add_blocks||[]).forEach(b=>{if(b&&typeof b.text==='string')r.blocks.push({title:String(b.title||'Fixed copy'),text:b.text,hint:String(b.hint||'Fixed from your suggestion. The original is unchanged in the first tab.')})});
    (p.notes||[]).forEach(n=>{if(n&&n.text)r.facts.push({label:String(n.label||'Fix note'),html:escH(n.text)})});
    (p.chips_add||[]).forEach(t=>{t=String(t);if(!r.chips.includes(t))r.chips.push(t)});
    (p.tags_add||[]).forEach(t=>{t=String(t);if(!r.tags.includes(t))r.tags.push(t)});
    if(typeof p.section==='string'&&p.section)r.section=p.section;

      const u=t.closest('[data-undo]');if(u){const k=u.dataset.undo.slice(0,2),id=u.dataset.undo.slice(3);if(S[k][id]?.sent)return;if(S[k][id]?.opened&&!confirm('Undo this local draft? This does not cancel an issue if you published it on GitHub.'))return;delete S[k][id];changed();redraw();paint();w.querySelector('.box').focus()}};
    w.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}if(e.key==='Tab'){const els=[...w.querySelectorAll('button,a[href],textarea,input,select,summary')].filter(el=>!el.disabled&&el.getClientRects().length);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===w.querySelector('.box'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    document.body.appendChild(w);w.showModal();w.querySelector('.box').focus();
  }
  function rememberOpened(items=urlItems,blob=sendBlob){
    const ticket='b'+Date.now()+'-'+crypto.getRandomValues(new Uint32Array(1))[0];
    S.tx[ticket]={items:items.map(x=>x.slice()),blob,at:Date.now()};
    for(const [k,id,at] of items)if(S[k][id]?.at===at)S[k][id].opened=ticket;
    save();toastM('Publish the issue on GitHub, then return to confirm its URL.');
  }
  function showPaste(){
    const w=document.createElement('dialog');w.className='rr-paste';
    w.innerHTML='<h3>Long encrypted request</h3><p>Copy this encrypted body and paste it into the issue on GitHub. Publish there, then return and confirm the issue URL.</p><textarea readonly aria-label="Encrypted issue body" style="width:100%;height:160px"></textarea><button type="button">Copy encrypted body</button> <a target="_blank" rel="noopener noreferrer">Open GitHub</a> <button type="button" data-close>Close</button><p role="status"></p>';
    const body=sendBody,link=url,items=urlItems.map(x=>x.slice()),blob=sendBlob;
    w.querySelector('textarea').value=body;w.querySelector('a').href=link;
    w.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(body);w.querySelector('[role=status]').textContent='Encrypted body copied.'}catch(e){w.querySelector('textarea').select();w.querySelector('[role=status]').textContent='Copy the selected text manually.'}};
    w.querySelector('a').onclick=()=>{rememberOpened(items,blob);bar()};
    const origin=document.activeElement;w.querySelector('[data-close]').onclick=()=>w.close();w.onclose=()=>{w.remove();if(origin?.isConnected)origin.focus()};document.body.appendChild(w);w.showModal();
  }
  let rq=0;function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;try{detail();cards()}catch(e){}})}
  function ui(){
    started=true;const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    barEl=document.createElement('div');barEl.className='rr-bar';barEl.hidden=true;document.body.appendChild(barEl);
    fabEl=document.createElement('button');fabEl.type='button';fabEl.className='btn rr-fab';fabEl.innerHTML='\u270E Requests';fabEl.setAttribute('aria-label','Your list and search requests');fabEl.onclick=sheet;document.body.appendChild(fabEl);
    barEl.addEventListener('click',e=>{
      if(e.target.closest('.rr-rev')){sheet();return}
      const check=e.target.closest('.rr-confirm');if(check){confirmBatch(check.dataset.ticket);return}
      const a=e.target.closest('.rr-send');if(a){
        if(!url){e.preventDefault();buildUrl();return}
        if(pasteMode){e.preventDefault();showPaste();return}
        rememberOpened();setTimeout(()=>{bar();redraw()},0);
      }});
    new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
    window.addEventListener('hashchange',sched);
    bar();buildUrl();sched();
  }
  return {filter,ui,_t:{rid,seal,S,META,removed,patches,doneSg,doneRq}};
}


function shortTitle(r){
  if(typeof r.stitle==='string'&&r.stitle.trim())return r.stitle.trim();
  const original=String(r.title||'');
  const clean=original;
  if(clean.length<=90)return clean||original;
  const cut=clean.slice(0,87).replace(/\s+\S*$/,'');return cut+'…';
}
function setDisplayTitle(h,r){const text=shortTitle(r);if(h.textContent!==text)h.textContent=text;if(h.title!==r.title)h.title=r.title||''}

ation':'Reintentar preparación','Original prompt':'Prompt original','Neutral rebuild':'Versión neutra','Inferred prompt':'Prompt inferido','Details':'Detalles','Search prompts':'Buscar prompts'};
  const translated=new WeakMap();
  function translate(){
    const es=language.value==='es';document.documentElement.lang=es?'es':'en';
    document.querySelectorAll('[aria-label],input[placeholder]').forEach(el=>{for(const attr of ['aria-label','placeholder']){if(!el.hasAttribute(attr))continue;const current=el.getAttribute(attr),key=attr==='aria-label'?'rrAriaLabelSource':'rrPlaceholderSource';const source=el.dataset[key]||current;el.dataset[key]=source;const next=es?(dictionary[source]||source):source;if(current!==next)el.setAttribute(attr,next)}});
    document.querySelectorAll('button,summary,option,optgroup,[role=tab],.rr-tools a,.rr-bar a,.rr-sheet a,.rr-paste a').forEach(el=>{
      if(el.tagName==='OPTGROUP'){const current=el.label,old=translated.get(el);const source=old&&current===old.rendered?old.source:current;const next=es?(dictionary[source]||source):source;if(current!==next)el.label=next;translated.set(el,{source,rendered:next});return}
      const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;
      while(node=walker.nextNode()){const current=node.nodeValue,old=translated.get(node);const source=old&&current===old.rendered?old.source:current;const match=source.trim().match(/^(.*?)(\s*\d+)?$/),stem=match?.[1],suffix=match?.[2]||'';const next=es&&dictionary[stem]?source.replace(source.trim(),dictionary[stem]+suffix):source;if(current!==next)node.nodeValue=next;translated.set(node,{source,rendered:next})}
    });
  }

  translate();new MutationObserver(translate).observe(document.body,{childList:true,subtree:true});
}

function failMsg(e){return 'Your library could not load ('+((e&&e.message)||e)+'). Check your connection and try again.'}
async function onLoad(){
  if(!window.crypto||!crypto.subtle||!('DecompressionStream' in window)){showForm('This browser is too old to open the library. Update it, or try another browser.');return}
  const q=new URLSearchParams(location.search);
  const oldHash=location.hash;const m=oldHash.match(/staticrypt_pwd=([^&]*)/);
  let hp=m?m[1]:q.get('staticrypt_pwd'), rem=oldHash.includes('remember_me')||q.has('remember_me');
  const logout=q.has('staticrypt_logout')||oldHash.includes('staticrypt_logout');
  for(const k of ['staticrypt_pwd','staticrypt_logout','remember_me'])q.delete(k);
  if(hp||logout||rem){const tail=q.toString();history.replaceState(null,'',location.pathname+(tail?'?'+tail:'')+(/^#p\d+$/.test(oldHash)?oldHash:''))}
  if(logout){clearSaved();showForm();return}
  if(!hp){const exp=Number(saved.get(KE));if(!Number.isFinite(exp)||exp<=Date.now())clearSaved();hp=saved.get(KP);rem=false}
  if(!hp){showForm();return}
  try{const r=await unlock(hp,rem);if(r==='bad'){clearSaved();showForm()}}
  catch(e){showForm(failMsg(e))}
}

  catch(err){btn.disabled=false;btn.value='DECRYPT';$('gate-status').textContent=failMsg(err)}
});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onLoad);else onLoad();
