<!DOCTYPE html>
<html class="staticrypt-html" lang="en" data-rr-gate="2">
<head>
<meta charset="utf-8" />
<title>Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style id="gate-style">
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #171717;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #171717;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f5f5f5;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
</head>

async function unlock(hp,remember){

/* ---- Remove marks and fix suggestions ----
   Marks and suggestions are kept on this device (localStorage rr_marks_v1) until you tap Send.
   Send opens a pre-filled GitHub issue on Misterpepe22/reading-room holding ONE locked blob
   (ECDH P-256 + AES-GCM to Sesame's inbox key). Only issues filed by Misterpepe22 are accepted by the
   nightly cleanup. The blob also carries the patch key (HKDF of the library key, info "patch"), which
   lets the cleanup lock fixes in d/p.enc without ever knowing the library password.
   Public files read here: d/removed.json (opaque ids of removed posts) and d/p.enc (locked fixes). */
const INBOX_PUB='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEb8S7w8DLbVnfF4V8MxGND94SDXBEwd5xcxycn6/149UApjOqWP5e4Q8GRwIa5QOvsUQ2iZVH8A6mgfE+gpb0Dw==', ISSUE_URL='https://github.com/Misterpepe22/reading-room/issues/new', MK='rr_marks_v1', MAXB=6200;

async function marksInit(hp){

    if(Array.isArray(p.hide_images)){const h=new Set(p.hide_images);r.images=r.images.filter((m,k)=>!h.has(k))}
    (p.add_blocks||[]).forEach(b=>{if(b&&typeof b.text==='string')r.blocks.push({title:String(b.title||'Fixed copy'),text:b.text,hint:String(b.hint||'Fixed from your suggestion. The original is unchanged in the first tab.')})});
    (p.notes||[]).forEach(n=>{if(n&&n.text)r.facts.push({label:String(n.label||'Fix note'),html:escH(n.text)})});
    (p.chips_add||[]).forEach(t=>{t=String(t);if(!r.chips.includes(t))r.chips.push(t)});
    (p.tags_add||[]).forEach(t=>{t=String(t);if(!r.tags.includes(t))r.tags.push(t)});

  const TRASH='<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

function failMsg(e){return 'Your library could not load ('+((e&&e.message)||e)+'). Check your connection and try again.'}
async function onLoad(){
  if(!window.crypto||!crypto.subtle||!('DecompressionStream' in window)){showForm('This browser is too old to open the library. Update it, or try another browser.');return}
  const q=new URLSearchParams(location.search);
  if(q.has('staticrypt_logout')||location.hash.includes('staticrypt_logout')){clearSaved();showForm();return}
  const m=location.hash.match(/staticrypt_pwd=([^&]*)/);
  let hp=m?m[1]:q.get('staticrypt_pwd'), rem=location.hash.includes('remember_me')||q.has('remember_me');
  if(!hp){const exp=localStorage.getItem(KE);if(exp&&Date.now()>parseInt(exp))clearSaved();hp=localStorage.getItem(KP);rem=false}
  if(!hp){showForm();return}
  try{const r=await unlock(hp,rem);if(r==='bad'){clearSaved();showForm()}}
  catch(e){showForm(failMsg(e))}
}
const eye=document.querySelector('.staticrypt-toggle-password-visibility');
eye.addEventListener('click',()=>{const p=$('staticrypt-password');const show=p.type==='password';p.type=show?'text':'password';eye.src=show?EYE_OPEN:EYE_CLOSED;eye.alt=eye.title=show?'Hide password':'Show password'});
$('staticrypt-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.querySelector('.staticrypt-decrypt-button');btn.disabled=true;btn.value='OPENING...';
  try{const hp=await hashPw($('staticrypt-password').value);const r=await unlock(hp,$('staticrypt-remember').checked);if(r==='bad'){btn.disabled=false;btn.value='DECRYPT';alert('Bad password!')}}
  catch(err){btn.disabled=false;btn.value='DECRYPT';alert(failMsg(err))}
});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onLoad);else onLoad();
