<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Library maintenance key</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}input,button{font-size:16px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}#out{word-break:break-all;font-family:monospace;font-size:12px}</style></head>
<body>
<h1>Library maintenance</h1>
<p>Temporary page for a one-time maintenance step. Your password is checked in this browser and only a locked copy of the derived key is shown, readable by Sesame alone. Nothing is saved.</p>
<form id="f" action="#" method="post">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password">
<button type="submit" id="go">Continue</button>
</form>
<p id="st" role="status"></p>
<div id="out"></div>
<script>
(function(){
const SALT='d1d5efe0716c96e1ac992e2eedc127af',PUB='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEb8S7w8DLbVnfF4V8MxGND94SDXBEwd5xcxycn6/149UApjOqWP5e4Q8GRwIa5QOvsUQ2iZVH8A6mgfE+gpb0Dw==';
const te=new TextEncoder(),sub=crypto.subtle;
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
const b64u=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pb(pw,it,h){const k=await sub.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await sub.deriveBits({name:'PBKDF2',hash:h,iterations:it,salt:te.encode(SALT)},k,256))}
async function hashPw(p){let h=await pb(p,1000,'SHA-1');h=await pb(h,14000,'SHA-256');return pb(h,585000,'SHA-256')}
async function check(hp){const ikm=await sub.importKey('raw',unhex(hp),'HKDF',false,['deriveKey']);const key=await sub.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('reading-room/v2'),info:te.encode('content')},ikm,{name:'AES-GCM',length:256},false,['decrypt']);const b=new Uint8Array(await (await fetch('d/m.enc',{cache:'no-store'})).arrayBuffer());await sub.decrypt({name:'AES-GCM',iv:b.subarray(4,16),additionalData:b.subarray(0,4)},key,b.subarray(16));return true}
async function gz(u){const s=new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function seal(obj){const pub=await sub.importKey('spki',b64d(PUB),{name:'ECDH',namedCurve:'P-256'},false,[]);const eph=await sub.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);const shared=await sub.deriveBits({name:'ECDH',public:pub},eph.privateKey,256);const epub=new Uint8Array(await sub.exportKey('raw',eph.publicKey));const hk=await sub.importKey('raw',shared,'HKDF',false,['deriveKey']);const k=await sub.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('rr-inbox/v1'),info:epub},hk,{name:'AES-GCM',length:256},false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await sub.encrypt({name:'AES-GCM',iv},k,await gz(te.encode(JSON.stringify(obj)))));const o=new Uint8Array(77+ct.length);o.set(epub);o.set(iv,65);o.set(ct,77);return b64u(o)}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('st'),out=document.getElementById('out'),pw=document.getElementById('password');st.textContent='Checking...';out.textContent='';
 try{const hp=await hashPw(pw.value);pw.value='';try{await check(hp)}catch(x){st.textContent='RESULT: WRONG PASSWORD (the library did not open).';return}
  const blob=await seal({v:1,purpose:'rr-maintenance',hp,at:Date.now()});st.textContent='RESULT: PASSWORD OK. Locked key below.';out.textContent='rr-key:v1:'+blob+':end';}
 catch(x){st.textContent='RESULT: ERROR '+(x&&x.message||x)}});
})();
</script>
</body></html>
